name: Codex

# ============================================================================
# Long-lived Codex session on a GitHub-hosted runner, served through
# codex-web (https://github.com/0xcaff/codex-web) and tunneled with ngrok.
# A second tunnel exposes "filebrowser" so you can read/edit the runner's
# filesystem (including ~/.codex config) from a browser, since codex-web
# has no file explorer of its own.
#
# PERSISTENCE, KEPT SIMPLE ON PURPOSE
# ----------------------------------------------------------------------------
# Everything under $HOME (/home/runner) is cached as one blob and restored
# at the start of every run -- Codex's own config/sessions, npm/pip/cargo/go
# caches and anything they installed, and the checked-out repo (so files
# like project.c survive). No per-tool redirection: whatever a tool's
# default install/cache location is, it's already under $HOME, so it's
# already covered. The only thing excluded is /home/runner/work, which is
# the runner's own scratch space (temp files, tool-cache, action code) --
# not anything you or Codex created.
#
# SAVE STRATEGY (bounded loss even on a random cancel/crash)
# ----------------------------------------------------------------------------
# - Every ~7 min, a background loop rebuilds a checkpoint tarball on disk.
# - Every ~4th checkpoint (~28 min) that tarball is also uploaded as a
#   short-retention artifact, in case the runner's disk itself is lost.
# - At the 340-min mark, the session stops on purpose and a full, unhurried
#   final save runs with the remaining ~15-20 min budget (Actions Cache +
#   a full-retention artifact). This is the reliable path.
# - If the job is cancelled/crashes before that, GitHub still runs
#   `if: always()` steps for up to ~5 min before hard-killing the job; a
#   final step uploads whatever checkpoint is already sitting on disk
#   (fast, since it's pre-built) as an emergency backup. It's a no-op if
#   the normal path already finished.
#
# DISK-SPACE WATCHDOG
# ----------------------------------------------------------------------------
# Upstream Codex has known issues (openai/codex #24948, #41806, #33735,
# #35458, #34061) where ~/.codex/sessions/**/rollout-*.jsonl can grow to
# tens-hundreds of GB during long sessions, because compaction re-embeds
# the full prior history (incl. screenshots) into a new line each time.
# This workflow prunes oversized/stale rollout files on every checkpoint
# tick and watches free disk space, escalating cleanup if it gets low.
#
# REQUIRED REPOSITORY SECRETS
# ----------------------------------------------------------------------------
#   NGROK_AUTHTOKEN  - from https://dashboard.ngrok.com/get-started/your-authtoken
#   OPENAI_API_KEY   - optional; without it, a cached ~/.codex/auth.json
#                      from a previous login is required instead.
#
# No auth on the tunnels -- that's intentional, by request. Anyone with the
# URL can use Codex and the file browser, so don't post the URL publicly.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Interactive session length in minutes (keep under 355)"
        default: "340"
        required: false
      checkpoint_interval_minutes:
        description: "How often to refresh the on-disk checkpoint tarball"
        default: "7"
        required: false
      enable_offbox_snapshots:
        description: "Also upload periodic short-retention checkpoint artifacts"
        type: boolean
        default: true
      offbox_snapshot_every_n_checkpoints:
        description: "Upload an off-box snapshot every N on-disk checkpoints"
        default: "4"
        required: false
      artifact_retention_days:
        description: "Retention (days) for the final full backup artifact"
        default: "14"
        required: false
      codex_npm_tag:
        description: "npm dist-tag or version for @openai/codex"
        default: "latest"
        required: false
      skip_disk_cleanup:
        description: "Skip the pre-run disk cleanup (debugging only)"
        type: boolean
        default: false

concurrency:
  group: codex-web-session
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHECKPOINT_DIR: /tmp/codex-checkpoint
  SESSION_MINUTES: ${{ inputs.session_minutes || '340' }}
  CHECKPOINT_INTERVAL_MINUTES: ${{ inputs.checkpoint_interval_minutes || '7' }}
  OFFBOX_EVERY_N: ${{ inputs.offbox_snapshot_every_n_checkpoints || '4' }}
  ENABLE_OFFBOX: ${{ inputs.enable_offbox_snapshots }}
  ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days || '14' }}
  CODEX_NPM_TAG: ${{ inputs.codex_npm_tag || 'latest' }}

jobs:
  codex-session:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Verify required secrets are configured
        run: |
          if [ -z "${{ secrets.NGROK_AUTHTOKEN }}" ]; then
            echo "::error::Missing required repository secret: NGROK_AUTHTOKEN. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "::warning::OPENAI_API_KEY is not set. The workflow will rely on a previously-cached ~/.codex/auth.json instead. If this is the first ever run, Codex login will fail."
          fi

      - name: Free disk space (remove unneeded preinstalled tooling)
        if: ${{ inputs.skip_disk_cleanup != true }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Extra cleanup + disk report
        run: |
          sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo journalctl --vacuum-size=50M || true
          sudo apt-get clean || true
          echo "### Disk space after cleanup" >> "$GITHUB_STEP_SUMMARY"
          df -h / >> "$GITHUB_STEP_SUMMARY"
          df -h /

      - name: Prepare working directories
        run: |
          mkdir -p "$CHECKPOINT_DIR/pids" "$HOME/bin" "$HOME/logs"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # actions/checkout refuses a path outside the default workspace, so the
      # repo lands at the normal /home/runner/work/<owner>/<repo> location.
      # That's still under $HOME, so it's still covered by the whole-$HOME
      # cache below -- we just exclude the runner's own internal scratch
      # folders (_temp, _tool, _actions, ...) that live alongside it, since
      # those are regenerated fresh every run and aren't your data.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # actions/cache entries are immutable per key, so we save with a
      # run-id-unique key and restore via a prefix (restore-keys), which
      # always resolves to the most recent matching entry. Everything under
      # $HOME is one blob -- Codex config/sessions, npm/pip/cargo/go caches,
      # anything installed, the checked-out repo -- except the runner's own
      # internal work subfolders, which aren't user data.
      - name: Restore persistent state cache (whole $HOME)
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner
            !/home/runner/work/_temp
            !/home/runner/work/_tool
            !/home/runner/work/_actions
            !/home/runner/work/_actionsMetadata
            !/home/runner/work/_PipelineMapping
          key: codex-home-${{ github.run_id }}
          restore-keys: |
            codex-home-

      # /var/cache/apt/archives/partial is root-only (mode 700) and not
      # world-readable, which makes the cache action's tar step fail with
      # a permission error -- exclude it, it's just in-progress downloads
      # and is empty once apt-get finishes anyway.
      - name: Restore apt package archive cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /var/cache/apt/archives
            !/var/cache/apt/archives/partial
          key: apt-archives-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            apt-archives-${{ runner.os }}-

      - name: Reinstall previously-added apt packages from cache (e.g. gcc)
        run: |
          # System packages (apt) can't truly "stay installed" between runs --
          # each run is a fresh VM. What we CAN persist is the .deb download,
          # so reinstalling is a local, offline, few-second operation instead
          # of a slow download+install. We track what was added last time in
          # $HOME/apt-manifest.txt, written at shutdown below.
          manifest="$HOME/apt-manifest.txt"
          if [ -s "$manifest" ]; then
            echo "Reinstalling previously-added apt packages from cached archives:"
            cat "$manifest"
            sudo apt-get install -y --no-download-progress $(cat "$manifest") || \
              echo "::warning::Some previously-added apt packages failed to reinstall from cache; they may need a fresh download this run."
          else
            echo "No previous apt-manifest.txt found; nothing to reinstall."
          fi
          apt list --installed 2>/dev/null | awk -F/ '{print $1}' | sort > "$RUNNER_TEMP/apt-baseline.txt"

      - name: Write shared session library
        run: |
          cat > "$RUNNER_TEMP/lib.sh" <<'LIBEOF'
          # shellcheck shell=bash
          log() { printf '[%(%H:%M:%S)T] %s\n' -1 "$*"; }

          prune_codex_sessions() {
            # Mitigates openai/codex #24948 / #41806 / #33735 / #35458 / #34061:
            # rollout-*.jsonl files can grow unbounded (observed: tens to
            # hundreds of GB) because compaction re-embeds full history
            # (including inline screenshots) on every compaction event.
            local sess="$HOME/.codex/sessions"
            [ -d "$sess" ] || return 0
            find "$sess" -type f -name '*.jsonl' -mmin +30 -size +150M -print -delete 2>/dev/null | while read -r f; do
              log "pruned oversized rollout file: $f"
            done
          }

          check_disk_space() {
            local avail_mb
            avail_mb=$(df -Pm / | awk 'NR==2{print $4}')
            if [ "$avail_mb" -lt 1024 ]; then
              log "CRITICAL: only ${avail_mb}MB free. Forcing aggressive session prune + early stop."
              find "$HOME/.codex/sessions" -type f -name '*.jsonl' -mmin +5 -delete 2>/dev/null || true
              touch "$CHECKPOINT_DIR/CRITICAL_DISK"
            elif [ "$avail_mb" -lt 3072 ]; then
              log "WARNING: low disk space (${avail_mb}MB free). Pruning sessions harder."
              find "$HOME/.codex/sessions" -type f -name '*.jsonl' -mmin +10 -size +50M -delete 2>/dev/null || true
            fi
          }

          build_checkpoint() {
            # level 1 = fast, used for frequent background checkpoints.
            local level="${1:-1}"
            local tmp="$CHECKPOINT_DIR/checkpoint.tar.zst.tmp"
            local final="$CHECKPOINT_DIR/checkpoint.tar.zst"
            if tar --exclude="./work/_temp" --exclude="./work/_tool" \
                   --exclude="./work/_actions" --exclude="./work/_actionsMetadata" \
                   --exclude="./work/_PipelineMapping" \
                   --use-compress-program="zstd -T0 -${level}" \
                   -cf "$tmp" -C "$HOME" . \
                   2>>"$CHECKPOINT_DIR/checkpoint.log"; then
              mv -f "$tmp" "$final"
              log "checkpoint built: $(du -h "$final" | cut -f1)"
            else
              log "WARNING: checkpoint build failed, keeping previous checkpoint"
            fi
          }

          push_offbox_snapshot() {
            [ "$ENABLE_OFFBOX" = "true" ] || return 0
            [ -f "$CHECKPOINT_DIR/checkpoint.tar.zst" ] || return 0
            local name="codex-checkpoint-$(date +%H%M%S)"
            node "$RUNNER_TEMP/artifact-tool/upload.cjs" "$name" "$CHECKPOINT_DIR/checkpoint.tar.zst" 1 \
              >>"$CHECKPOINT_DIR/checkpoint.log" 2>&1 \
              && log "off-box snapshot uploaded: $name" \
              || log "off-box snapshot upload failed (non-fatal, on-disk checkpoint is still current)"
          }

          wait_for_ngrok_url() {
            # Single agent, single local API (127.0.0.1:4040) serving both
            # tunnels -- filter by the tunnel's name from ngrok.yml.
            local name="$1" varfile="$2" tries=40
            for _ in $(seq 1 "$tries"); do
              url=$(curl -fsS "http://127.0.0.1:4040/api/tunnels" 2>/dev/null | \
                    node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);const t=(j.tunnels||[]).find(t=>t.name===process.argv[1]);console.log(t?t.public_url:"")}catch(e){}})' "$name")
              if [ -n "$url" ]; then
                echo "$url" > "$varfile"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          ensure_alive() {
            for pf in "$CHECKPOINT_DIR"/pids/*.pid; do
              [ -f "$pf" ] || continue
              local name; name=$(basename "$pf" .pid)
              local pid; pid=$(cat "$pf")
              if ! kill -0 "$pid" 2>/dev/null; then
                log "WARNING: process '$name' (pid $pid) is no longer running. Check $HOME/logs/$name.log"
              fi
            done
          }
          LIBEOF
          echo "Library written to $RUNNER_TEMP/lib.sh"

      - name: Install off-box snapshot uploader (best-effort artifact helper)
        if: ${{ inputs.enable_offbox_snapshots == true }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-tool"
          cd "$RUNNER_TEMP/artifact-tool"
          npm init -y >/dev/null 2>&1
          npm install --no-save @actions/artifact >/dev/null 2>&1 || {
            echo "::warning::Could not install @actions/artifact; off-box snapshots will be skipped (on-disk checkpoints still work)."
            exit 0
          }
          cat > upload.cjs <<'JSEOF'
          (async () => {
            try {
              const { DefaultArtifactClient } = await import('@actions/artifact');
              const [, , name, file, retention] = process.argv;
              const path = require('path');
              const client = new DefaultArtifactClient();
              await client.uploadArtifact(name, [file], path.dirname(file), {
                retentionDays: Number(retention) || 1,
              });
              console.log('uploaded', name);
            } catch (err) {
              console.error('upload failed (non-fatal):', err && err.message);
              process.exit(0); // never fail the caller
            }
          })();
          JSEOF

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -y
          sudo apt-get install -y ngrok zstd

      - name: Install/update latest Codex CLI
        run: |
          npm install -g "@openai/codex@${CODEX_NPM_TAG}"
          codex --version

      - name: Install filebrowser (web file explorer for the runner)
        run: |
          if [ ! -x "$HOME/bin/filebrowser" ]; then
            curl -fsSL https://raw.githubusercontent.com/filebrowser/get/master/get.sh | bash
            cp "$(command -v filebrowser)" "$HOME/bin/filebrowser"
          fi
          "$HOME/bin/filebrowser" version

      - name: Authenticate Codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            printenv OPENAI_API_KEY | codex login --with-api-key
          elif [ -f "$HOME/.codex/auth.json" ]; then
            echo "Using restored auth.json from the persistent cache."
          else
            echo "::error::No OPENAI_API_KEY secret and no cached ~/.codex/auth.json. Set the secret, or seed auth.json once (see header comment)."
            exit 1
          fi

      - name: Start filebrowser (rooted at the runner home directory)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          FB_DB="$HOME/filebrowser.db"
          if [ ! -f "$FB_DB" ]; then
            "$HOME/bin/filebrowser" -d "$FB_DB" config init
            "$HOME/bin/filebrowser" -d "$FB_DB" config set --auth.method=noauth
          fi
          nohup "$HOME/bin/filebrowser" -d "$FB_DB" -r /home/runner -a 127.0.0.1 -p 8081 \
            > "$HOME/logs/filebrowser.log" 2>&1 &
          echo $! > "$CHECKPOINT_DIR/pids/filebrowser.pid"
          log "filebrowser started (pid $(cat "$CHECKPOINT_DIR/pids/filebrowser.pid"))"

      - name: Start codex-web
        run: |
          source "$RUNNER_TEMP/lib.sh"
          export CODEX_CLI_PATH="$(command -v codex)"
          nohup npx --yes github:0xcaff/codex-web \
            > "$HOME/logs/codex-web.log" 2>&1 &
          echo $! > "$CHECKPOINT_DIR/pids/codex-web.pid"
          log "codex-web started (pid $(cat "$CHECKPOINT_DIR/pids/codex-web.pid"))"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8214 >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Start ngrok tunnels
        run: |
          source "$RUNNER_TEMP/lib.sh"
          # Written to $RUNNER_TEMP, not $HOME -- $HOME gets cached/uploaded,
          # and this file has to contain the raw authtoken.
          cat > "$RUNNER_TEMP/ngrok.yml" <<'NGROKEOF'
          version: "2"
          authtoken: ${{ secrets.NGROK_AUTHTOKEN }}
          tunnels:
            codex:
              proto: http
              addr: 8214
            files:
              proto: http
              addr: 8081
          NGROKEOF

          nohup ngrok start --all --config "$RUNNER_TEMP/ngrok.yml" \
            --log=stdout --log-format=json \
            > "$HOME/logs/ngrok.log" 2>&1 &
          echo $! > "$CHECKPOINT_DIR/pids/ngrok.pid"

          wait_for_ngrok_url "codex" "$RUNNER_TEMP/codex_url.txt" || { echo "::error::ngrok tunnel for codex-web never came up"; cat "$HOME/logs/ngrok.log"; exit 1; }
          wait_for_ngrok_url "files" "$RUNNER_TEMP/files_url.txt" || { echo "::error::ngrok tunnel for filebrowser never came up"; cat "$HOME/logs/ngrok.log"; exit 1; }

          CODEX_URL=$(cat "$RUNNER_TEMP/codex_url.txt")
          FILES_URL=$(cat "$RUNNER_TEMP/files_url.txt")
          echo "::notice title=Codex Web URL::${CODEX_URL}"
          echo "::notice title=File Browser URL::${FILES_URL}"
          {
            echo "## Your Codex session is live"
            echo ""
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| Codex Web | ${CODEX_URL} |"
            echo "| File Browser | ${FILES_URL} |"
            echo ""
            echo "Session budget: **${SESSION_MINUTES} minutes**, then automatic graceful shutdown + save."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Interactive session (checkpointing every few minutes)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          trap 'log "signal received - fast on-disk checkpoint before exit"; prune_codex_sessions; build_checkpoint 1; exit 0' TERM INT

          end_time=$(( $(date +%s) + SESSION_MINUTES * 60 ))
          interval=$(( CHECKPOINT_INTERVAL_MINUTES * 60 ))
          last_checkpoint=0
          checkpoint_count=0

          log "Session running for up to ${SESSION_MINUTES} minutes. Checkpointing every ${CHECKPOINT_INTERVAL_MINUTES} minutes."

          while [ "$(date +%s)" -lt "$end_time" ]; do
            now=$(date +%s)
            check_disk_space
            ensure_alive

            if [ -f "$CHECKPOINT_DIR/CRITICAL_DISK" ]; then
              log "Critical disk condition flagged - ending session early to protect data."
              break
            fi

            if [ $(( now - last_checkpoint )) -ge "$interval" ]; then
              prune_codex_sessions
              build_checkpoint 1
              last_checkpoint=$now
              checkpoint_count=$(( checkpoint_count + 1 ))
              if [ $(( checkpoint_count % OFFBOX_EVERY_N )) -eq 0 ]; then
                push_offbox_snapshot
              fi
            fi

            remaining=$(( (end_time - now) / 60 ))
            [ $(( checkpoint_count % 5 )) -eq 0 ] && log "~${remaining} minutes remaining in session"
            sleep 30
          done

          log "Session time budget reached (or ended early). Proceeding to graceful shutdown."

      - name: Stop services and build final checkpoint
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/lib.sh" ]; then
            echo "::warning::Session library was never written -- an earlier step must have failed before this session started. Nothing was running, so there's nothing to check-point."
            exit 0
          fi
          source "$RUNNER_TEMP/lib.sh"
          for pf in "$CHECKPOINT_DIR"/pids/*.pid; do
            [ -f "$pf" ] || continue
            pid=$(cat "$pf")
            kill -TERM "$pid" 2>/dev/null || true
          done
          sleep 5
          for pf in "$CHECKPOINT_DIR"/pids/*.pid; do
            [ -f "$pf" ] || continue
            pid=$(cat "$pf")
            kill -KILL "$pid" 2>/dev/null || true
          done

          prune_codex_sessions

          apt list --installed 2>/dev/null | awk -F/ '{print $1}' | sort > "$RUNNER_TEMP/apt-final.txt"
          comm -13 "$RUNNER_TEMP/apt-baseline.txt" "$RUNNER_TEMP/apt-final.txt" > "$HOME/apt-manifest.txt" || true

          build_checkpoint 9   # higher compression, we're not in a hurry here
          touch "$CHECKPOINT_DIR/GRACEFUL_STOP_DONE"

          echo "### Final disk usage" >> "$GITHUB_STEP_SUMMARY"
          du -sh "$HOME"/* 2>/dev/null | sort -rh >> "$GITHUB_STEP_SUMMARY" || true
          df -h / >> "$GITHUB_STEP_SUMMARY"

      - name: Save persistent state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner
            !/home/runner/work/_temp
            !/home/runner/work/_tool
            !/home/runner/work/_actions
            !/home/runner/work/_actionsMetadata
            !/home/runner/work/_PipelineMapping
          key: codex-home-${{ github.run_id }}

      - name: Save apt package archive cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /var/cache/apt/archives
            !/var/cache/apt/archives/partial
          key: apt-archives-${{ runner.os }}-${{ github.run_id }}

      - name: Upload final session backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-session-final-${{ github.run_id }}
          path: ${{ env.CHECKPOINT_DIR }}/checkpoint.tar.zst
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: warn

      - name: Check whether emergency save is needed
        if: always()
        id: emergency_check
        run: |
          if [ -f "$CHECKPOINT_DIR/GRACEFUL_STOP_DONE" ]; then
            echo "Graceful shutdown already completed and saved everything. Nothing to do."
            echo "checkpoint_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Graceful shutdown did not complete (job was likely cancelled or crashed). Running emergency save of the most recent checkpoint."
          echo "checkpoint_exists=$( [ -f "$CHECKPOINT_DIR/checkpoint.tar.zst" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Emergency cache save
        if: ${{ always() && steps.emergency_check.outputs.checkpoint_exists == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner
            !/home/runner/work/_temp
            !/home/runner/work/_tool
            !/home/runner/work/_actions
            !/home/runner/work/_actionsMetadata
            !/home/runner/work/_PipelineMapping
          key: codex-home-emergency-${{ github.run_id }}

      - name: Emergency artifact upload
        if: ${{ always() && steps.emergency_check.outputs.checkpoint_exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-session-EMERGENCY-${{ github.run_id }}
          path: ${{ env.CHECKPOINT_DIR }}/checkpoint.tar.zst
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: warn
