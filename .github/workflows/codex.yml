name: Codex

# ============================================================================
# WHAT THIS DOES
# ----------------------------------------------------------------------------
# Starts a long-lived (~340 min) session on a fresh Ubuntu GitHub-hosted
# runner, installs the latest Codex CLI, serves it through codex-web
# (https://github.com/0xcaff/codex-web), and tunnels it to the public
# internet with ngrok. A second ngrok tunnel exposes a "filebrowser" web
# file manager rooted at your home directory, so you can read/edit the
# Codex config and anything else on the runner from a browser (codex-web
# itself has no file explorer).
#
# Everything under $PERSIST_DIR (Codex home/config, npm/pip/cargo/go
# caches, the checked-out repo, and anything else Codex writes there) is
# restored at the start of the run and saved back at the end, so repeated
# runs get faster and nothing you asked to keep is lost between sessions.
#
# SAFETY / SECURITY NOTES (read before using)
# ----------------------------------------------------------------------------
# 1. No auth is set up on the tunnels (by request). Anyone who gets the
#    ngrok URL can run arbitrary commands as the runner user via Codex, and
#    read/write/delete files via the file browser. Treat the URLs as
#    secrets -- don't paste them anywhere public. ngrok assigns a random
#    URL each run, which is your only real protection here; for anything
#    more sensitive, add auth back (ngrok supports --basic-auth) or an
#    IP restriction on your ngrok dashboard.
# 2. This workflow is meant to be started manually (workflow_dispatch) by
#    you, for your own use. Don't wire it to run on pushes/PRs from
#    strangers.
# 3. GitHub-hosted runners hard-cap a job at 360 minutes no matter what
#    timeout you set. This workflow budgets 340 minutes of interactive
#    session time and reserves the rest for a *graceful, non-rushed*
#    shutdown and save -- see "PERSISTENCE / SAVE STRATEGY" below.
#
# REQUIRED REPOSITORY SECRETS
# ----------------------------------------------------------------------------
#   NGROK_AUTHTOKEN   - from https://dashboard.ngrok.com/get-started/your-authtoken
#   OPENAI_API_KEY     - optional. If unset, the workflow instead expects a
#                        previously-cached ~/.codex/auth.json (see the
#                        "Authenticate Codex" step) from an earlier
#                        `codex login` you seeded once, e.g. by uploading it
#                        as a run artifact and unpacking it into the persist
#                        cache on the first run.
#
# PERSISTENCE / SAVE STRATEGY (what happens if this run dies mid-way)
# ----------------------------------------------------------------------------
# Layer 1 - On-disk checkpoint: a background loop rebuilds a compressed
#           tarball of $PERSIST_DIR on disk every ~7 minutes (configurable).
#           Worst case uncontrolled loss: ~7 minutes of work.
# Layer 2 - Off-box snapshot: every ~4th checkpoint (~28 min) that tarball
#           is also uploaded as a short-retention run artifact, so you don't
#           lose everything even if the runner's disk itself is unrecoverable.
#           Best-effort; failures here never fail the job.
# Layer 3 - Graceful stop (primary path): at the 340-minute mark the
#           interactive session is stopped on purpose, services are shut
#           down cleanly, a *full, unhurried* final checkpoint is built, and
#           it's saved to both Actions Cache (for fast restore next run) and
#           a full-retention artifact (for you to download directly). This
#           runs with the ~15-20 minute buffer, not the 5-minute cancellation
#           window, so it is the reliable path.
# Layer 4 - Emergency fallback: if the job is cancelled or crashes *before*
#           Layer 3 gets to run, GitHub still runs `if: always()` steps for
#           up to ~5 minutes before hard-killing the job. A final always()
#           step uploads whatever Layer 1 checkpoint already exists on disk
#           (it's pre-built, so this is just an upload -- fast) and attempts
#           a cache save. It's a no-op if Layer 3 already completed.
#
# Honest limit: nothing can save data *instantly* the moment a cancel is
# clicked -- GitHub gives a running step ~10 seconds to react and only 5
# minutes total to every remaining always() step combined, which is not
# enough time to tar+upload many GB from scratch. That's why Layer 1 keeps
# a ready-to-upload checkpoint warm on disk at all times instead of trying
# to build one from nothing during the cancellation window.
#
# KNOWN CODEX DISK-SPACE FOOTGUN (researched via openai/codex issue tracker)
# ----------------------------------------------------------------------------
# Multiple open/recent upstream issues (openai/codex #24948, #41806, #33735,
# #35458, #34061, #31478) describe ~/.codex/sessions/**/rollout-*.jsonl
# growing to tens or hundreds of GB during long sessions: each context
# compaction re-embeds the *entire* prior history (including base64
# screenshots) into a new JSONL line, so size grows roughly quadratically
# with session length, and old rollouts are never pruned automatically.
# There's also a slower-growing ~/.codex/logs_2.sqlite trace log (#31478).
# This workflow proactively prunes large/old rollout files on every
# checkpoint tick and watches free disk space, escalating cleanup (and, if
# truly critical, forcing an early graceful stop) rather than letting the
# runner run out of disk mid-session.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Interactive session length in minutes (keep well under 355; default leaves ~15-20 min to save)"
        default: "340"
        required: false
      checkpoint_interval_minutes:
        description: "How often to refresh the on-disk checkpoint tarball"
        default: "7"
        required: false
      enable_offbox_snapshots:
        description: "Also upload periodic short-retention checkpoint artifacts (extra insurance, small overhead)"
        type: boolean
        default: true
      offbox_snapshot_every_n_checkpoints:
        description: "Upload an off-box snapshot every N on-disk checkpoints"
        default: "4"
        required: false
      artifact_retention_days:
        description: "Retention (days) for the final full backup artifact"
        default: "14"
        required: false
      codex_npm_tag:
        description: "npm dist-tag or version for @openai/codex"
        default: "latest"
        required: false
      skip_disk_cleanup:
        description: "Skip the pre-run disk cleanup (debugging only)"
        type: boolean
        default: false

concurrency:
  group: codex-web-session
  cancel-in-progress: false

permissions:
  contents: read

env:
  PERSIST_DIR: /home/runner/persist
  CHECKPOINT_DIR: /home/runner/checkpoint
  CODEX_HOME: /home/runner/persist/codex-home
  NPM_CONFIG_CACHE: /home/runner/persist/caches/npm
  NPM_CONFIG_PREFIX: /home/runner/persist/npm-global
  PIP_CACHE_DIR: /home/runner/persist/caches/pip
  XDG_CACHE_HOME: /home/runner/persist/caches/xdg
  CARGO_HOME: /home/runner/persist/caches/cargo
  GOPATH: /home/runner/persist/caches/go
  GOMODCACHE: /home/runner/persist/caches/go/pkg/mod
  SESSION_MINUTES: ${{ inputs.session_minutes || '340' }}
  CHECKPOINT_INTERVAL_MINUTES: ${{ inputs.checkpoint_interval_minutes || '7' }}
  OFFBOX_EVERY_N: ${{ inputs.offbox_snapshot_every_n_checkpoints || '4' }}
  ENABLE_OFFBOX: ${{ inputs.enable_offbox_snapshots }}
  ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days || '14' }}
  CODEX_NPM_TAG: ${{ inputs.codex_npm_tag || 'latest' }}

jobs:
  codex-session:
    runs-on: ubuntu-latest
    # Hard cap on GitHub-hosted runners is 360 min regardless of this value.
    # We stop the interactive part at SESSION_MINUTES (default 340) and keep
    # this a little under the hard cap so our own graceful-stop steps run as
    # NORMAL steps (full time budget) instead of racing the 5-min
    # cancellation window.
    timeout-minutes: 355

    steps:
      # ---------------------------------------------------------------
      # 0. Fail fast if required secrets are missing
      # ---------------------------------------------------------------
      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -z "${{ secrets.NGROK_AUTHTOKEN }}" ] && missing+=("NGROK_AUTHTOKEN")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "::warning::OPENAI_API_KEY is not set. The workflow will rely on a previously-cached ~/.codex/auth.json instead. If this is the first ever run, Codex login will fail."
          fi

      # ---------------------------------------------------------------
      # 1. Free up runner disk space BEFORE doing anything else.
      #    jlumbroso/free-disk-space reliably reclaims ~20-30GB by
      #    removing Android/.NET/Haskell/large preinstalled packages,
      #    unused Docker images, and swap. tool-cache is left alone
      #    since we set up Node ourselves right after and don't want to
      #    fight the hosted tool cache.
      # ---------------------------------------------------------------
      - name: Free disk space (remove unneeded preinstalled tooling)
        if: ${{ inputs.skip_disk_cleanup != true }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Extra cleanup + disk report
        run: |
          sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo journalctl --vacuum-size=50M || true
          sudo apt-get clean || true
          echo "### Disk space after cleanup" >> "$GITHUB_STEP_SUMMARY"
          df -h / >> "$GITHUB_STEP_SUMMARY"
          df -h /

      # ---------------------------------------------------------------
      # 2. Checkout the repo INTO the persist dir, so anything Codex
      #    writes to the working tree (e.g. project.c) is automatically
      #    covered by the checkpoint/cache mechanism below.
      # ---------------------------------------------------------------
      - name: Prepare persistent directories
        run: |
          mkdir -p "$PERSIST_DIR" "$CHECKPOINT_DIR" \
                   "$CODEX_HOME" "$NPM_CONFIG_CACHE" "$NPM_CONFIG_PREFIX" \
                   "$PIP_CACHE_DIR" "$XDG_CACHE_HOME" "$CARGO_HOME" "$GOPATH" \
                   "$PERSIST_DIR/workspace" "$PERSIST_DIR/logs" "$PERSIST_DIR/bin"
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$PERSIST_DIR/bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: persist/workspace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ---------------------------------------------------------------
      # 3. Restore everything persistent from the previous run.
      #    actions/cache entries are immutable per key, so we save with
      #    a run-id-unique key and restore via a prefix (restore-keys),
      #    which always resolves to the most recent matching entry.
      # ---------------------------------------------------------------
      - name: Restore persistent state cache (Codex home, tool caches, workspace)
        id: cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PERSIST_DIR }}
          key: codex-persist-${{ github.run_id }}
          restore-keys: |
            codex-persist-

      - name: Restore apt package archive cache
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/apt/archives
          key: apt-archives-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            apt-archives-${{ runner.os }}-

      - name: Reinstall previously-added apt packages from cache (e.g. gcc)
        run: |
          # System packages (apt) can't truly "stay installed" between runs --
          # each run is a fresh VM. What we CAN persist is the .deb download,
          # so reinstalling is a local, offline, few-second operation instead
          # of a slow download+install. We track what you added last time in
          # $PERSIST_DIR/apt-manifest.txt (written at shutdown, see below).
          manifest="$PERSIST_DIR/apt-manifest.txt"
          if [ -s "$manifest" ]; then
            echo "Reinstalling previously-added apt packages from cached archives:"
            cat "$manifest"
            sudo apt-get install -y --no-download-progress $(cat "$manifest") || \
              echo "::warning::Some previously-added apt packages failed to reinstall from cache; they may need a fresh download this run."
          else
            echo "No previous apt-manifest.txt found; nothing to reinstall."
          fi
          apt list --installed 2>/dev/null | awk -F/ '{print $1}' | sort > "$RUNNER_TEMP/apt-baseline.txt"

      # ---------------------------------------------------------------
      # 4. Shared helper library, sourced by every later shell step.
      # ---------------------------------------------------------------
      - name: Write shared session library
        run: |
          cat > "$RUNNER_TEMP/lib.sh" <<'LIBEOF'
          # shellcheck shell=bash
          log() { printf '[%(%H:%M:%S)T] %s\n' -1 "$*"; }

          prune_codex_sessions() {
            # Mitigates openai/codex #24948 / #41806 / #33735 / #35458 / #34061:
            # rollout-*.jsonl files can grow unbounded (observed: tens to
            # hundreds of GB) because compaction re-embeds full history
            # (including inline screenshots) on every compaction event.
            local sess="$CODEX_HOME/sessions"
            [ -d "$sess" ] || return 0
            # Drop anything over 150MB and older than 30 minutes -- generous
            # enough to keep your current/recent sessions resumable, but
            # stops runaway files from eating the whole disk.
            find "$sess" -type f -name '*.jsonl' -mmin +30 -size +150M -print -delete 2>/dev/null | while read -r f; do
              log "pruned oversized rollout file: $f"
            done
          }

          check_disk_space() {
            local avail_mb
            avail_mb=$(df -Pm / | awk 'NR==2{print $4}')
            if [ "$avail_mb" -lt 1024 ]; then
              log "CRITICAL: only ${avail_mb}MB free. Forcing aggressive session prune + early stop."
              find "$CODEX_HOME/sessions" -type f -name '*.jsonl' -mmin +5 -delete 2>/dev/null || true
              touch "$CHECKPOINT_DIR/CRITICAL_DISK"
            elif [ "$avail_mb" -lt 3072 ]; then
              log "WARNING: low disk space (${avail_mb}MB free). Pruning sessions harder."
              find "$CODEX_HOME/sessions" -type f -name '*.jsonl' -mmin +10 -size +50M -delete 2>/dev/null || true
            fi
          }

          build_checkpoint() {
            # level 1 = fast, used for frequent background checkpoints.
            local level="${1:-1}"
            local tmp="$CHECKPOINT_DIR/checkpoint.tar.zst.tmp"
            local final="$CHECKPOINT_DIR/checkpoint.tar.zst"
            if tar --use-compress-program="zstd -T0 -${level}" \
                   -cf "$tmp" -C "$(dirname "$PERSIST_DIR")" "$(basename "$PERSIST_DIR")" \
                   2>>"$CHECKPOINT_DIR/checkpoint.log"; then
              mv -f "$tmp" "$final"
              log "checkpoint built: $(du -h "$final" | cut -f1)"
            else
              log "WARNING: checkpoint build failed, keeping previous checkpoint"
            fi
          }

          push_offbox_snapshot() {
            [ "$ENABLE_OFFBOX" = "true" ] || return 0
            [ -f "$CHECKPOINT_DIR/checkpoint.tar.zst" ] || return 0
            local name="codex-checkpoint-$(date +%H%M%S)"
            node "$RUNNER_TEMP/artifact-tool/upload.cjs" "$name" "$CHECKPOINT_DIR/checkpoint.tar.zst" 1 \
              >>"$CHECKPOINT_DIR/checkpoint.log" 2>&1 \
              && log "off-box snapshot uploaded: $name" \
              || log "off-box snapshot upload failed (non-fatal, on-disk checkpoint is still current)"
          }

          wait_for_ngrok_url() {
            local api="$1" varfile="$2" tries=40
            for _ in $(seq 1 "$tries"); do
              url=$(curl -fsS "http://127.0.0.1:${api}/api/tunnels" 2>/dev/null | \
                    node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);console.log((j.tunnels&&j.tunnels[0]&&j.tunnels[0].public_url)||"")}catch(e){}})')
              if [ -n "$url" ]; then
                echo "$url" > "$varfile"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          ensure_alive() {
            for pf in "$CHECKPOINT_DIR"/pids/*.pid; do
              [ -f "$pf" ] || continue
              local name; name=$(basename "$pf" .pid)
              local pid; pid=$(cat "$pf")
              if ! kill -0 "$pid" 2>/dev/null; then
                log "WARNING: process '$name' (pid $pid) is no longer running. Check $PERSIST_DIR/logs/$name.log"
              fi
            done
          }
          LIBEOF
          mkdir -p "$CHECKPOINT_DIR/pids"
          echo "Library written to $RUNNER_TEMP/lib.sh"

      - name: Install off-box snapshot uploader (best-effort artifact helper)
        if: ${{ inputs.enable_offbox_snapshots == true }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-tool"
          cd "$RUNNER_TEMP/artifact-tool"
          npm init -y >/dev/null 2>&1
          npm install --no-save @actions/artifact >/dev/null 2>&1 || {
            echo "::warning::Could not install @actions/artifact; off-box snapshots will be skipped (on-disk checkpoints still work)."
            exit 0
          }
          cat > upload.cjs <<'JSEOF'
          (async () => {
            try {
              const { DefaultArtifactClient } = await import('@actions/artifact');
              const [, , name, file, retention] = process.argv;
              const path = require('path');
              const client = new DefaultArtifactClient();
              await client.uploadArtifact(name, [file], path.dirname(file), {
                retentionDays: Number(retention) || 1,
              });
              console.log('uploaded', name);
            } catch (err) {
              console.error('upload failed (non-fatal):', err && err.message);
              process.exit(0); // never fail the caller
            }
          })();
          JSEOF

      # ---------------------------------------------------------------
      # 5. Install ngrok, Codex CLI (latest), codex-web deps, filebrowser.
      #    All installs land in caches under $PERSIST_DIR, so repeat runs
      #    are much faster even though we always re-run `npm install` to
      #    guarantee "latest".
      # ---------------------------------------------------------------
      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -y
          sudo apt-get install -y ngrok zstd
          ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}"

      - name: Install/update latest Codex CLI
        run: |
          npm install -g "@openai/codex@${CODEX_NPM_TAG}"
          codex --version

      - name: Install filebrowser (web file explorer for the runner)
        run: |
          if [ ! -x "$PERSIST_DIR/bin/filebrowser" ]; then
            curl -fsSL https://raw.githubusercontent.com/filebrowser/get/master/get.sh | bash
            cp "$(command -v filebrowser)" "$PERSIST_DIR/bin/filebrowser"
          fi
          "$PERSIST_DIR/bin/filebrowser" version

      # ---------------------------------------------------------------
      # 6. Authenticate Codex (API key preferred for CI; falls back to
      #    a restored auth.json from a prior interactive login).
      # ---------------------------------------------------------------
      - name: Authenticate Codex
        run: |
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            codex login --api-key "${{ secrets.OPENAI_API_KEY }}"
          elif [ -f "$CODEX_HOME/auth.json" ]; then
            echo "Using restored auth.json from the persistent cache."
          else
            echo "::error::No OPENAI_API_KEY secret and no cached $CODEX_HOME/auth.json. Set the secret, or seed auth.json once (see header comment)."
            exit 1
          fi

      # ---------------------------------------------------------------
      # 7. Start filebrowser, codex-web, and two ngrok tunnels (each
      #    protected with HTTP Basic Auth), all in the background.
      # ---------------------------------------------------------------
      - name: Start filebrowser (rooted at the runner home directory)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          FB_DB="$PERSIST_DIR/filebrowser.db"
          if [ ! -f "$FB_DB" ]; then
            "$PERSIST_DIR/bin/filebrowser" -d "$FB_DB" config init
            "$PERSIST_DIR/bin/filebrowser" -d "$FB_DB" config set --auth.method=noauth
          fi
          nohup "$PERSIST_DIR/bin/filebrowser" -d "$FB_DB" -r /home/runner -a 127.0.0.1 -p 8081 \
            > "$PERSIST_DIR/logs/filebrowser.log" 2>&1 &
          echo $! > "$CHECKPOINT_DIR/pids/filebrowser.pid"
          log "filebrowser started (pid $(cat "$CHECKPOINT_DIR/pids/filebrowser.pid"))"

      - name: Start codex-web
        run: |
          source "$RUNNER_TEMP/lib.sh"
          export CODEX_CLI_PATH="$(command -v codex)"
          nohup npx --yes github:0xcaff/codex-web \
            > "$PERSIST_DIR/logs/codex-web.log" 2>&1 &
          echo $! > "$CHECKPOINT_DIR/pids/codex-web.pid"
          log "codex-web started (pid $(cat "$CHECKPOINT_DIR/pids/codex-web.pid"))"
          # give it a moment to bind before we point ngrok at it
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8214 >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Start ngrok tunnels (Basic Auth protected)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          nohup ngrok http 8214 \
            --web-addr=127.0.0.1:4040 --log=stdout --log-format=json \
            > "$PERSIST_DIR/logs/ngrok-codex.log" 2>&1 &
          echo $! > "$CHECKPOINT_DIR/pids/ngrok-codex.pid"

          nohup ngrok http 8081 \
            --web-addr=127.0.0.1:4041 --log=stdout --log-format=json \
            > "$PERSIST_DIR/logs/ngrok-files.log" 2>&1 &
          echo $! > "$CHECKPOINT_DIR/pids/ngrok-files.pid"

          wait_for_ngrok_url 4040 "$RUNNER_TEMP/codex_url.txt" || { echo "::error::ngrok tunnel for codex-web never came up"; cat "$PERSIST_DIR/logs/ngrok-codex.log"; exit 1; }
          wait_for_ngrok_url 4041 "$RUNNER_TEMP/files_url.txt" || { echo "::error::ngrok tunnel for filebrowser never came up"; cat "$PERSIST_DIR/logs/ngrok-files.log"; exit 1; }

          CODEX_URL=$(cat "$RUNNER_TEMP/codex_url.txt")
          FILES_URL=$(cat "$RUNNER_TEMP/files_url.txt")
          echo "::notice title=Codex Web URL::${CODEX_URL}"
          echo "::notice title=File Browser URL::${FILES_URL}"
          {
            echo "## 🚀 Your Codex session is live"
            echo ""
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| Codex Web | ${CODEX_URL} |"
            echo "| File Browser | ${FILES_URL} |"
            echo ""
            echo "⚠️ No auth on these links -- treat them as secrets, don't share the URL."
            echo ""
            echo "Session budget: **${SESSION_MINUTES} minutes**, then automatic graceful shutdown + save."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # 8. Main interactive window: keep everything alive, checkpoint
      #    on a schedule, watch disk space, until the time budget is up.
      # ---------------------------------------------------------------
      - name: Interactive session (checkpointing every few minutes)
        run: |
          source "$RUNNER_TEMP/lib.sh"
          trap 'log "signal received - fast on-disk checkpoint before exit"; prune_codex_sessions; build_checkpoint 1; exit 0' TERM INT

          end_time=$(( $(date +%s) + SESSION_MINUTES * 60 ))
          interval=$(( CHECKPOINT_INTERVAL_MINUTES * 60 ))
          last_checkpoint=0
          checkpoint_count=0

          log "Session running for up to ${SESSION_MINUTES} minutes. Checkpointing every ${CHECKPOINT_INTERVAL_MINUTES} minutes."

          while [ "$(date +%s)" -lt "$end_time" ]; do
            now=$(date +%s)
            check_disk_space
            ensure_alive

            if [ -f "$CHECKPOINT_DIR/CRITICAL_DISK" ]; then
              log "Critical disk condition flagged - ending session early to protect data."
              break
            fi

            if [ $(( now - last_checkpoint )) -ge "$interval" ]; then
              prune_codex_sessions
              build_checkpoint 1
              last_checkpoint=$now
              checkpoint_count=$(( checkpoint_count + 1 ))
              if [ $(( checkpoint_count % OFFBOX_EVERY_N )) -eq 0 ]; then
                push_offbox_snapshot
              fi
            fi

            remaining=$(( (end_time - now) / 60 ))
            [ $(( checkpoint_count % 5 )) -eq 0 ] && log "~${remaining} minutes remaining in session"
            sleep 30
          done

          log "Session time budget reached (or ended early). Proceeding to graceful shutdown."

      # ---------------------------------------------------------------
      # 9. Graceful shutdown + full, unhurried final save (primary
      #    persistence path -- runs with the full remaining time budget,
      #    not the 5-minute cancellation window).
      # ---------------------------------------------------------------
      - name: Stop services and build final checkpoint
        if: always()
        run: |
          source "$RUNNER_TEMP/lib.sh"
          for pf in "$CHECKPOINT_DIR"/pids/*.pid; do
            [ -f "$pf" ] || continue
            pid=$(cat "$pf")
            kill -TERM "$pid" 2>/dev/null || true
          done
          sleep 5
          for pf in "$CHECKPOINT_DIR"/pids/*.pid; do
            [ -f "$pf" ] || continue
            pid=$(cat "$pf")
            kill -KILL "$pid" 2>/dev/null || true
          done

          prune_codex_sessions

          # Record any apt packages added this session so next run's
          # "reinstall from cache" step can bring gcc/etc back quickly.
          apt list --installed 2>/dev/null | awk -F/ '{print $1}' | sort > "$RUNNER_TEMP/apt-final.txt"
          comm -13 "$RUNNER_TEMP/apt-baseline.txt" "$RUNNER_TEMP/apt-final.txt" > "$PERSIST_DIR/apt-manifest.txt" || true

          build_checkpoint 9   # higher compression, we're not in a hurry here
          touch "$CHECKPOINT_DIR/GRACEFUL_STOP_DONE"

          echo "### Final disk usage" >> "$GITHUB_STEP_SUMMARY"
          du -sh "$PERSIST_DIR"/* 2>/dev/null | sort -rh >> "$GITHUB_STEP_SUMMARY" || true
          df -h / >> "$GITHUB_STEP_SUMMARY"

      - name: Save persistent state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PERSIST_DIR }}
          key: codex-persist-${{ github.run_id }}

      - name: Save apt package archive cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /var/cache/apt/archives
          key: apt-archives-${{ runner.os }}-${{ github.run_id }}

      - name: Upload final session backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-session-final-${{ github.run_id }}
          path: ${{ env.CHECKPOINT_DIR }}/checkpoint.tar.zst
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: warn

      # ---------------------------------------------------------------
      # 10. Emergency fallback -- only does real work if the graceful
      #     path above never got to run (e.g. the job was cancelled or
      #     crashed earlier). Uploads whatever on-disk checkpoint already
      #     exists; it's pre-built so this is just an upload, fast enough
      #     to fit GitHub's ~5-minute always() window on cancellation.
      # ---------------------------------------------------------------
      - name: Emergency fallback save (only runs if graceful save was interrupted)
        if: always()
        run: |
          if [ -f "$CHECKPOINT_DIR/GRACEFUL_STOP_DONE" ]; then
            echo "Graceful shutdown already completed and saved everything. Nothing to do."
            exit 0
          fi
          echo "::warning::Graceful shutdown did not complete (job was likely cancelled or crashed). Running emergency save of the most recent checkpoint."
          echo "checkpoint_exists=$( [ -f "$CHECKPOINT_DIR/checkpoint.tar.zst" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
        id: emergency_check

      - name: Emergency cache save
        if: ${{ always() && steps.emergency_check.outputs.checkpoint_exists == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PERSIST_DIR }}
          key: codex-persist-emergency-${{ github.run_id }}

      - name: Emergency artifact upload
        if: ${{ always() && steps.emergency_check.outputs.checkpoint_exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-session-EMERGENCY-${{ github.run_id }}
          path: ${{ env.CHECKPOINT_DIR }}/checkpoint.tar.zst
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: warn
